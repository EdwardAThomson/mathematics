name = "rayo-lean"
defaultTargets = ["Rayo"]

# Self-contained, no-Mathlib project: first-order set theory over `in`,
# with a hereditarily-finite-set model, satisfaction relation, and the
# k = 0 uniqueness spike.

[[lean_lib]]
name = "Rayo"
globs = ["Rayo.Syntax", "Rayo.Satisfaction", "Rayo.K0", "Rayo.K1", "Rayo.K2", "Rayo.K3", "Rayo.K4", "Rayo.K5", "Rayo.K6", "Rayo.Encoding"]
